on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync

      - name: Run tests
        env:
          SECRET_DJANGO_KEY: ${{ secrets.SECRET_DJANGO_KEY }}
        run: uv run pytest -v
