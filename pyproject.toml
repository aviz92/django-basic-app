[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-basic-app"  # "django-basic-app-template"
version = "0.0.1"
description = "A basic Django app template for development projects"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Avi Zaguri" }, ]
keywords = ["development", "python", "django"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "custom-python-logger>=2.0.13",
    "drf-easy-crud>=2.0.0",
    "django-versioned-models==1.0.0",
    "pytest-plugins>=2.0.2",
    "python-base-toolkit>=1.0.3",
    "beautifulsoup4>=4.14.3",
    "django>=5.2.11",
    "django-filter>=25.2",
    "django-models>=1.0",
    "django-schema-graph>=3.1.0",
    "djangorestframework>=3.16.1",
    "pre-commit>=4.5.0",
    "pydantic>=2.12.4",
    "pytest>=9.0.1",
    "pytest-django>=4.11.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "setuptools>=80.9.0",
    "tenacity>=9.1.2",
    "wheel>=0.45.1",
]

[project.urls]
Homepage = "https://github.com/aviz92/django-basic-app"
Repository = "https://github.com/aviz92/django-basic-app"
Issues = "https://github.com/aviz92/django-basic-app/issues"

[tool.setuptools.packages.find]
where = ["."]
# include = ["django_basic_app*"]
namespaces = false

[project.scripts]  # must using "uv sync" or "uv pip install -e ." first
run_pytest_marker = "scripts.ci.run_pytest_marker:main"
clean_pycache = "scripts.django.clean__pycache__:main"
clean_migrations = "scripts.django.clean_migrations:main"
