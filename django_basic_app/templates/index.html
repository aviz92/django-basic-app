<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Environment | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #09090b;
            font-family: 'Fira Code', monospace;
            color: #e4e4e7;
        }
        .cursor-border {
            border: 1px solid rgba(63, 63, 70, 0.4);
        }
        .cursor-card:hover {
            border-color: #3b82f6;
            background-color: rgba(39, 39, 42, 0.6);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start pt-20 px-6">

    <div class="w-full max-w-3xl mb-12 border-b border-zinc-800 pb-6 text-left">
        <div class="flex items-center gap-3 mb-2">
            <div class="h-3 w-3 rounded-full bg-green-500 animate-pulse"></div>
            <h1 class="text-xl font-medium tracking-tight">Local Development Server</h1>
        </div>
        <p class="text-zinc-500 text-sm">Active routes detected in <span class="text-blue-400">core/urls.py</span></p>
    </div>

    <div class="w-full max-w-3xl space-y-3">
        {% for link in links %}
        <a href="{{ link.route }}" class="cursor-card cursor-border flex items-center justify-between p-4 rounded-md transition-all duration-200 group">
            <div class="flex items-center gap-4">
                <span class="text-zinc-600 group-hover:text-blue-400 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                </span>
                <span class="text-sm font-medium">{{ link.name }}</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs text-zinc-600 font-mono tracking-tighter">{{ link.route }}</span>
                <span class="text-zinc-700 group-hover:text-zinc-400 transform transition-transform group-hover:translate-x-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </span>
            </div>
        </a>
        {% endfor %}
    </div>

    <div class="fixed bottom-0 w-full bg-zinc-950 border-t border-zinc-800 px-6 py-2 flex justify-between items-center text-[10px] text-zinc-500 uppercase tracking-widest">
        <div>Project: django_basic_app</div>
        <div class="flex gap-4">
            <span class="flex items-center gap-1"><span class="h-1.5 w-1.5 rounded-full bg-blue-500"></span> 200 OK</span>
            <span class="text-zinc-600">UTF-8</span>
        </div>
    </div>

</body>
</html>
